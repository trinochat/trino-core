[package]
name = "trino-core"
version = "0.1.0"
description = "Protocol core for Trino Chat: X3DH, Double Ratchet, identity, message envelope and sealed vault"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["davidalmeidac"]
repository = "https://github.com/trinochat/trino-core"
readme = "README.md"
keywords = ["cryptography", "double-ratchet", "x3dh", "e2ee", "messaging"]
categories = ["cryptography", "authentication"]

# This crate is deliberately PURE: no networking, no async runtime, no UI, no
# platform APIs. It holds only the cryptography and wire format, so it can be
# audited on its own and reused by every client (desktop today, Flutter mobile
# over FFI next). Anything that performs I/O belongs in the application.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crypto primitives
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
# The vault's passphrase KDF. MIT OR Apache-2.0. Its `zeroize` feature wipes
# the crate's temporaries; kdf.rs wipes the memory matrix itself.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }

thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
# For the tests of the apps that use this crate, never for a build that
# ships: new version 3 vaults get Argon2id at `KdfParams::TEST` (8 KiB, one
# pass) instead of 64 MiB, so a test that creates or opens a vault does not
# pay a real derivation. The header names that KDF with a byte of its own
# (`kdf = 0xF1`), which a build without this feature refuses before
# deriving, and `KdfParams::check` refuses its parameters under the real
# KDF byte, so a vault written this way never opens, nor passes for a real
# one, in production. A release build with this feature does not compile
# (lib.rs). An app turns it on only in its dev-dependencies.
test-kdf = []

[dev-dependencies]
proptest = "1"

# Tests derive real keys: PBKDF2 with 600 000 rounds for the version 1 and 2
# vaults, and Argon2id at 64 MiB for version 3. Unoptimized, a single
# derivation takes seconds to tens of seconds, so the hash crates are built
# optimized in dev and test builds too. Profiles apply only when trino-core
# is the root package; an app that depends on it keeps its own.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
