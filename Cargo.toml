[package]
name = "trino-core"
version = "0.1.0"
description = "Trino Chat protocol core: X3DH, Double Ratchet, identity, envelope and sealed vault"
edition = "2021"
license = "AGPL-3.0-only"

# This crate is deliberately PURE: no networking, no async runtime, no UI, no
# platform APIs. It holds only the cryptography and wire format, so it can be
# audited on its own and reused by every client (desktop today, Flutter mobile
# over FFI next). Anything that performs I/O belongs in the app, not here.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crypto primitives
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1"
