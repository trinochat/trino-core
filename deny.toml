# cargo-deny — licence and advisory policy.
#
# trino-core is AGPL-3.0 with a commercial licence available from the copyright
# holder. That dual licensing only works while every dependency is permissively
# licensed: pulling in a single GPL/AGPL crate would make it impossible to grant
# a non-AGPL licence for a binary built from this code.
#
# This is why libsignal (AGPL-3.0, no exceptions) cannot be adopted here.
#
# Run with:  cargo deny check
# Install:   cargo install cargo-deny

[licenses]
# Permissive licences only — anything copyleft must be an explicit decision,
# not something that slips in during a `cargo update`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",       # file-level copyleft only; does not infect the binary
    "BSL-1.0",
    "Unlicense",
    "OpenSSL",
]
confidence-threshold = 0.8

# The allow-list above governs DEPENDENCIES. This crate is itself AGPL-3.0, and
# cargo-deny evaluates the whole graph including the root, so it needs an
# explicit exception — otherwise the policy rejects the very crate it protects.
exceptions = [
    { name = "trino-core", allow = ["AGPL-3.0-only"] },
]

[bans]
# Crates that would poison the dual-licence model if they ever appeared.
deny = [
    { name = "libsignal-protocol" },
]

[advisories]
# Fail the build on known vulnerabilities.
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[graph]
# The targets Trino ships to. Without this list cargo-deny also follows
# dependencies behind cfg(hax), which libcrux only uses for its formal
# verification and no build compiles; one of them (hax-lib, through
# proc-macro-error2) carries the unmaintained advisory RUSTSEC-2026-0173.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "aarch64-apple-ios",
]
